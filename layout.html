<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四岛布局 · Kita-Sora 排版编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6ecea;color:#223f50;font:15px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 22px;background:#f7f5ed}h1{font-size:19px;margin:0 auto 0 0}button,a.label{font:inherit;color:inherit;padding:8px 16px;border:1px solid #557480;background:transparent;border-radius:4px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#223f50;color:#fff}.hint{margin:12px 22px}main{padding:0 20px 30px;overflow:auto}iframe{transform-origin:top left;display:block;border:0;margin:auto;box-shadow:0 3px 20px #26434b22;background:#d9e9e5;max-width:none}#canvas-wrap{margin:auto}input[type=file]{max-width:240px}label{display:flex;gap:10px;align-items:center}#status{font-size:14px}#download{background:#223f50;color:#fff}
</style>
</head>
<body>
<header>
<h1>Kita-Sora · 官网四岛</h1>
<button id="desktop" aria-pressed="true">电脑</button>
<button id="mobile" aria-pressed="false">手机</button>
<button id="download" disabled>导出布局 JSON</button>
<label>导入布局<input id="import" type="file" accept=".json,application/json">
</label>
<a class="label" href="index.html">预览首页</a>
</header>
<p class="hint">拖动小岛移动，右下角拖动缩放。电脑和手机分别调整。选中小岛后也可用方向键移动，＋／－缩放。导出 JSON 后交给 Codex 落到页面。</p>
<p class="hint" id="status" role="status">正在加载布局…</p>
<main>
<div id="canvas-wrap">
<iframe id="canvas" title="官网四岛编辑画布" src="index.html?layoutEditor=1" width="1440" height="900">
</iframe>
</div>
</main>
<script src="assets/universe/layout-editor.js" defer>
</script>
</body>
</html>
