<header class="universe-heading china-heading"><p>Kita-Sora · The first shore</p><h1>Notes from <em>home.</em></h1></header><main class="china-page">
  <section class="china-entry" aria-label="China memo wall entry">
<p class="wall-cue">Three notes from home · tap a note to read</p>
    <div class="memo-wall-wrap"><picture><source media="(max-width:720px)" srcset="../assets/china-memo-wall-mobile.jpeg.webp"><img class="memo-wall-image" src="../assets/china-memo-wall-wide.jpeg.webp" alt="A real memo wall covered with photographs, notes, and objects from home" decoding="async"></picture></div>

    <button class="hotspot hotspot-harbor" data-story="home" type="button" aria-label="this thread began at home"><span>this thread began at home →</span></button>
    <button class="hotspot hotspot-return" data-story="returning" type="button" aria-label="things I keep returning to"><span>things I keep returning to →</span></button>
    <section class="china-story-shell" aria-hidden="true"><article class="story-card" role="dialog" aria-modal="true"><div class="story-kicker">china / a lived archive</div><h2 id="storyTitle"></h2><p id="storyCopy"></p><button class="story-close" type="button">back to the wall</button></article></section>
  </section>
</main>
<script>
const entry=document.querySelector('.china-entry');
const stories={leaving:['why i started leaving','the suitcase was never an escape plan. it was a small promise that ordinary life could still travel with me.'],home:['this thread began at home','a table, a shared meal, a friend’s laugh, the strange little objects that make a place feel inhabited.'],returning:['things i keep returning to','somewhere between departures, these fragments became a way of carrying home without freezing it in place.']};
const title=document.getElementById('storyTitle'),copy=document.getElementById('storyCopy');
document.querySelectorAll('.hotspot').forEach(h=>h.addEventListener('click',()=>{const [t,c]=stories[h.dataset.story];title.textContent=t;copy.textContent=c;entry.classList.add('is-selected');entry.querySelector('.china-story-shell').setAttribute('aria-hidden','false')}));
document.querySelector('.story-close').addEventListener('click',()=>{entry.classList.remove('is-selected');entry.querySelector('.china-story-shell').setAttribute('aria-hidden','true')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!entry.classList.contains('is-selected'))return;if(e.key==='Escape')document.querySelector('.story-close').click()});
const wrap=document.querySelector('.memo-wall-wrap');
// V1: pointer parallax paused.
</script>
