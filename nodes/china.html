<title>China — Kita-Sora</title>
<style>
:root{--warm:#f5efdf;--ink:#25383d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--warm);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.back{position:fixed;z-index:5;top:18px;left:20px;padding:5px 7px;color:rgba(37,56,61,.82);background:rgba(245,239,223,.58);font-size:10px;font-weight:400;letter-spacing:.08em;text-decoration:none;backdrop-filter:blur(3px)}
.china-page{width:100%;margin:0}.china-entry{position:relative;width:100%;height:100svh;min-height:100vh;overflow:hidden;background:#827061}.memo-wall-wrap{position:absolute;inset:-2%;transform:scale(1.035);transition:transform 1.8s cubic-bezier(.2,.72,.18,1);will-change:transform}.memo-wall-image{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}.hotspot{position:absolute;z-index:2;width:23vw;height:22vh;min-width:130px;min-height:100px;border:0;background:transparent;cursor:pointer}.hotspot:focus-visible{outline:1px solid rgba(255,255,255,.8);outline-offset:3px}.hotspot span{position:absolute;left:50%;top:50%;width:max-content;max-width:180px;opacity:0;transform:translate(-50%,10px);transition:opacity .35s ease,transform .35s ease;color:#fff;font-size:10px;line-height:1.3;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none}.hotspot:hover span,.hotspot:focus-visible span{opacity:1;transform:translate(-50%,0)}.hotspot-origin{left:8%;top:22%}.hotspot-harbor{left:42%;top:51%}.hotspot-return{right:6%;top:29%}.china-story-shell{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0;background:rgba(37,56,61,.12);transition:opacity .65s ease}.china-entry.is-selected .china-story-shell{pointer-events:auto;opacity:1}.china-entry.is-selected .memo-wall-wrap{transform:scale(1.055)}.china-entry.is-selected .hotspot{opacity:0;pointer-events:none;transition:opacity .45s ease}.story-card{width:min(440px,82vw);padding:34px 36px 30px;background:rgba(248,243,230,.95);box-shadow:0 18px 50px rgba(37,56,61,.2);transform:translateY(14px);transition:transform .65s ease}.china-entry.is-selected .story-card{transform:none}.story-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a46756}.story-card h2{margin:12px 0 13px;font:400 38px/1.05 Georgia,serif}.story-card p{font:italic 19px/1.45 Georgia,serif;color:#405257}.story-close{margin-top:24px;padding:7px 0;border:0;border-bottom:1px solid #a46756;background:none;color:#405257;font-size:10px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.story-space{width:1px;height:1px;overflow:hidden}
@media (max-width:720px){.memo-wall-wrap{inset:-3%;transform:scale(1.02)}.hotspot{width:32vw;height:20vh}.hotspot-origin{left:3%;top:20%}.hotspot-harbor{left:38%;top:52%}.hotspot-return{right:2%;top:32%}}
@media (prefers-reduced-motion:reduce){.memo-wall-wrap,.china-story-shell,.hotspot span{transition:none}}
</style>
<link rel="stylesheet" href="../assets/v1-consolidation/shell.css">
<link rel="stylesheet" href="../assets/universe/universe.css">
</head>
<body data-page="china">
<nav class="universe-nav" aria-label="Main navigation"><a class="universe-brand" href="../index.html#map">Kita-Sora</a><div class="universe-links" id="universe-links"><a href="../index.html#map" aria-current="location">Map</a><a href="https://lynnfromkitasora.substack.com" target="_blank" rel="noopener noreferrer">Letters</a><a href="../shop.html">Shop</a><a href="../shop/crochet.html">Harbor Loop</a><a href="../work.html">Work with me</a><a href="../about.html">About</a></div><a class="universe-subscribe" href="https://lynnfromkitasora.substack.com/subscribe" target="_blank" rel="noopener noreferrer">Subscribe</a><button class="universe-menu" aria-expanded="false" aria-controls="universe-links" type="button">Menu</button></nav>
<a class="back" href="../index.html#map">← World Map</a>
<main class="china-page">
  <section class="china-entry" aria-label="China memo wall entry">
<p class="wall-cue">Three notes from home · tap a note to read</p>
    <div class="memo-wall-wrap"><picture><source media="(max-width:720px)" srcset="../assets/china-memo-wall-mobile.jpeg.webp"><img class="memo-wall-image" src="../assets/china-memo-wall-wide.jpeg.webp" alt="A real memo wall covered with photographs, notes, and objects from home" decoding="async"></picture></div>
    <button class="hotspot hotspot-origin" data-story="leaving" type="button" aria-label="why I started leaving"><span>why I started leaving →</span></button>
    <button class="hotspot hotspot-harbor" data-story="home" type="button" aria-label="this thread began at home"><span>this thread began at home →</span></button>
    <button class="hotspot hotspot-return" data-story="returning" type="button" aria-label="things I keep returning to"><span>things I keep returning to →</span></button>
    <section class="china-story-shell" aria-hidden="true"><article class="story-card" role="dialog" aria-modal="true"><div class="story-kicker">china / a lived archive</div><h2 id="storyTitle"></h2><p id="storyCopy"></p><button class="story-close" type="button">back to the wall</button></article></section>
  </section>
</main>
<script>
const entry=document.querySelector('.china-entry');
const stories={leaving:['why i started leaving','the suitcase was never an escape plan. it was a small promise that ordinary life could still travel with me.'],home:['this thread began at home','a table, a shared meal, a friend’s laugh, the strange little objects that make a place feel inhabited.'],returning:['things i keep returning to','somewhere between departures, these fragments became a way of carrying home without freezing it in place.']};
const title=document.getElementById('storyTitle'),copy=document.getElementById('storyCopy');
document.querySelectorAll('.hotspot').forEach(h=>h.addEventListener('click',()=>{const [t,c]=stories[h.dataset.story];title.textContent=t;copy.textContent=c;entry.classList.add('is-selected');entry.querySelector('.china-story-shell').setAttribute('aria-hidden','false')}));
document.querySelector('.story-close').addEventListener('click',()=>{entry.classList.remove('is-selected');entry.querySelector('.china-story-shell').setAttribute('aria-hidden','true')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!entry.classList.contains('is-selected'))return;if(e.key==='Escape')document.querySelector('.story-close').click()});
const wrap=document.querySelector('.memo-wall-wrap');
// V1: pointer parallax paused.
</script>
<script src="../assets/v1-consolidation/shell.js" defer></script>
