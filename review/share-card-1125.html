<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kita-Sora · share artwork</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#dcebee;font-family:Georgia,serif;color:#143449}
body>:not(main):not(script):not(style){display:none!important}
main{position:relative;width:1200px;height:630px;background:url('../assets/world-map-pass-a/ocean-optimized.webp') center/cover no-repeat;overflow:hidden}
.logo{position:absolute;top:12px;left:20px;width:330px;height:66px;object-fit:contain;filter:brightness(0) saturate(100%) invert(17%) sepia(20%) saturate(1200%) hue-rotate(161deg) brightness(91%) contrast(94%)}
h1{position:absolute;top:72px;left:55px;font-size:31px;line-height:1.2;font-weight:400;text-shadow:0 1px 3px #fff8e7,0 0 10px #fff8e7;margin:0}
.island{position:absolute;object-fit:contain;filter:drop-shadow(3px 8px 5px #28434b44)}
.ithaca{width:340px;height:235px;left:440px;top:115px}
.harbor{width:290px;height:210px;left:820px;top:285px}
.market{width:260px;height:185px;left:495px;top:385px}
.workshop{width:255px;height:185px;left:120px;top:310px}
.mugi{position:absolute;width:77px;height:145px;object-fit:contain;left:947px;top:303px}
span{position:absolute;font-size:25px;text-shadow:0 1px 3px #fff8e7,0 0 9px #fff8e7}
.label-ithaca{left:560px;top:347px}.label-harbor{left:897px;top:492px}.label-market{left:581px;top:560px}.label-workshop{left:185px;top:490px}
</style>
</head>
<body>
<main>
<img class="logo" src="../assets/brand/logo-wordmark.png" alt="Kita-Sora">
<h1>Exploring outward, settling inward.</h1>
<img class="island ithaca" src="../assets/launch-20260915/yakumo-clean-alpha.png.webp" alt="">
<img class="island harbor" src="../assets/launch-20260915/harbor-clean-alpha.png.webp" alt="">
<img class="mugi" src="../assets/crochet/hokkaido-bear-cutout.png.webp" alt="">
<img class="island market" src="../assets/launch-20260915/shop-clean-alpha.png.webp" alt="">
<img class="island workshop" src="../assets/launch-20260915/harbor-clean-alpha.png.webp" alt="">
<span class="label-ithaca">Ithaca</span><span class="label-harbor">Harbor Loop</span><span class="label-market">Market</span><span class="label-workshop">Workshop</span>
</main>
</body>
</html>
